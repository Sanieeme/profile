<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Thank You | Shonisani Netshidzivhani</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: #000;
            color: #f5f5f5;

            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;
            text-align: center;
            padding: 20px;
        }

        .card {
            max-width: 600px;
            padding: 40px;

            background: rgba(24, 24, 24, 0.8);
            border: 1px solid rgba(212, 175, 55, 0.25);
            border-radius: 20px;

            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
        }

        .check {
            font-size: 4rem;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 2.8rem;
            color: #d4af37;
            margin-bottom: 10px;
        }

        p {
            color: #ccc;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            padding: 12px 22px;
            margin: 8px;

            background: #d4af37;
            color: #000;

            border-radius: 10px;
            text-decoration: none;

            font-weight: 600;

            transition: 0.3s ease;
        }

        .btn:hover {
            background: #c9a227;
            transform: translateY(-3px);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid #d4af37;
            color: #d4af37;
        }

        .btn-outline:hover {
            background: #d4af37;
            color: #000;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="check">✅</div>

        <h1>Message Sent!</h1>

        <p>
            Thanks for reaching out. I’ll respond as soon as possible.
        </p>

        <!-- BACK TO PROFILE -->
        <a class="btn" href="index.html#hero">Back to Profile</a>

        <!-- GO TO SECTIONS -->
        <a class="btn btn-outline" href="index.html#projects">View Projects</a>

        <a class="btn btn-outline" href="index.html#about">About Me</a>

    </div>

</body>
</html>
